{% extends "base.html" %}

{% block title %}Quiz{% endblock %}

{% block content %}
<div class="container mt-5">
    <!-- Top Bar: Timer and Progress -->
    <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-dark text-white rounded shadow">
        <h4 class="mb-0">Mathematics Pre-Test</h4>
        <!-- Notice the id="timer" here -->
        <div class="h4 mb-0 text-warning" id="timer">⏱️ 30:00</div>
    </div>

    <!-- Question Form -->
    <div class="card shadow">
        <div class="card-body">
            <!-- Notice the id="quiz-form" here -->
            <form id="quiz-form" action="/submit-quiz" method="POST">
                <!-- Question 1 -->
                <div class="mb-4">
                    <h5>Question 1 of 3</h5>
                    <p class="fs-5">Solve for x: 2x + 4 = 10</p>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="q1" value="A" id="q1a" required>
                        <label class="form-check-label" for="q1a">A) 2</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="q1" value="B" id="q1b">
                        <label class="form-check-label" for="q1b">B) 3</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="q1" value="C" id="q1c">
                        <label class="form-check-label" for="q1c">C) 5</label>
                    </div>
                </div>
                <hr>

                <!-- Question 2 -->
                <div class="mb-4">
                    <h5>Question 2 of 3</h5>
                    <p class="fs-5">What is the formula for the area of a circle?</p>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="q2" value="A" id="q2a" required>
                        <label class="form-check-label" for="q2a">A) 2πr</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="q2" value="B" id="q2b">
                        <label class="form-check-label" for="q2b">B) πr²</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="q2" value="C" id="q2c">
                        <label class="form-check-label" for="q2c">C) l × w</label>
                    </div>
                </div>
                <hr>

                <!-- Submit Button -->
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary btn-lg px-5">Submit Test</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- THE LOCKDOWN TIMER JAVASCRIPT -->
<script>
    // Set the time limit here (e.g., 30 minutes = 30 * 60 seconds)
    let timeLeft = 30 * 60;
    const timerElement = document.getElementById('timer');
    const quizForm = document.getElementById('quiz-form');

    const countdown = setInterval(() => {
        // Calculate minutes and seconds
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        // Add a leading zero if less than 10
        seconds = seconds < 10 ? '0' + seconds : seconds;

        // Update the HTML
        timerElement.innerHTML = `⏱️ ${minutes}:${seconds}`;

        // Change color to red when less than 5 minutes (300 seconds)
        if (timeLeft <= 300) {
            timerElement.classList.remove('text-warning');
            timerElement.classList.add('text-danger');
        }

        // If time is up
        if (timeLeft <= 0) {
            clearInterval(countdown);
            timerElement.innerHTML = "⏱️ Time's up!";
            alert("Time is up! Your test will be submitted automatically.");
            quizForm.submit(); // Automatically submit the form
        }

        timeLeft--;
    }, 1000); // 1000 milliseconds = 1 second
</script>
{% endblock %}
